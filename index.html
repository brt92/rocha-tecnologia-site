    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Geist', 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .mesh-gradient {
            background-color: #ffffff;
            background-image: radial-gradient(at 0% 0%, hsla(210,100%,93%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,100%,95%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(240,100%,93%,1) 0, transparent 50%);
        }
        .dark-mesh-gradient {
            background-color: #050505;
            background-image: radial-gradient(at 0% 0%, hsla(220,30%,10%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(240,30%,8%,1) 0, transparent 50%);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
